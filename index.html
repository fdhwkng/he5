    /* =========================================================
       1. CUSTOM SCROLL REVEAL HOOK & WRAPPER
       ========================================================= */
    function useScrollReveal(threshold = 0.12) {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
              observer.unobserve(el);
            }
          },
          { threshold }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, [threshold]);

      return [ref, isVisible];
    }

    function RevealBlock({ children, delay = 0, className = '' }) {
      const [ref, isVisible] = useScrollReveal(0.1);
      return (
        <div

          className={`${isVisible ? 'reveal-visible' : 'reveal-hidden'} ${className}`}

    /* =========================================================
       3. INTERACTIVE NEURAL NETWORK CANVAS (HERO BACKGROUND)
       ========================================================= */
    function NeuralNetworkCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = { x: width * 0.5, y: height * 0.5, active: false };
        const pulses = [];

        const nodeCount = Math.min(85, Math.floor((width * height) / 16000));
        const nodes = Array.from({ length: nodeCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.55,
          vy: (Math.random() - 0.5) * 0.55,
          radius: Math.random() * 2.2 + 1.2,
          color: Math.random() > 0.35 ? '#00f0ff' : '#a855f7',
          phase: Math.random() * Math.PI * 2,
        }));

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          mouse.active = true;
        };

        const handleClick = (e) => {
          pulses.push({ x: e.clientX, y: e.clientY, radius: 0, alpha: 0.9 });
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('click', handleClick);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Draw click shockwaves
          for (let i = pulses.length - 1; i >= 0; i--) {
            const p = pulses[i];
            p.radius += 6;
            p.alpha -= 0.018;
            if (p.alpha <= 0) {
              pulses.splice(i, 1);
              continue;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 240, 255, ${p.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Update and draw nodes
          for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            n.x += n.vx;
            n.y += n.vy;
            n.phase += 0.03;

            if (n.x < 0 || n.x > width) n.vx *= -1;
            if (n.y < 0 || n.y > height) n.vy *= -1;

            // Subtle attraction to cursor
            if (mouse.active) {
              const dx = mouse.x - n.x;
              const dy = mouse.y - n.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 180 && dist > 1) {
                n.x += (dx / dist) * 0.35;
                n.y += (dy / dist) * 0.35;
              }
            }

            // Draw connections
            for (let j = i + 1; j < nodes.length; j++) {
              const m = nodes[j];
              const dx = n.x - m.x;
              const dy = n.y - m.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 145) {
                const alpha = (1 - dist / 145) * 0.28;
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(m.x, m.y);
                ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                ctx.lineWidth = 0.85;
                ctx.stroke();
              }
            }

            // Connect node to mouse
            if (mouse.active) {
              const mDist = Math.hypot(n.x - mouse.x, n.y - mouse.y);
              if (mDist < 190) {
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = `rgba(168, 85, 247, ${(1 - mDist / 190) * 0.5})`;
                ctx.lineWidth = 1.1;
                ctx.stroke();
              }
            }

            // Draw glowing node
            const glowRadius = n.radius + Math.sin(n.phase) * 0.7;
            ctx.beginPath();
            ctx.arc(n.x, n.y, Math.max(0.8, glowRadius), 0, Math.PI * 2);
            ctx.fillStyle = n.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = n.color;
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('click', handleClick);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-75"
        />
      );
    }

    /* =========================================================
       5. 3D TILT INTERACTIVE CARD COMPONENT
       ========================================================= */
    function TiltDomainCard({ item, onSelect }) {
      const cardRef = useRef(null);
      const [transform, setTransform] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg)');
      const [glowPos, setGlowPos] = useState({ x: 50, y: 50, opacity: 0 });

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -7;
        const rotateY = ((x - centerX) / centerX) * 7;

        setTransform(`perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`);
        setGlowPos({
          x: (x / rect.width) * 100,
          y: (y / rect.height) * 100,
          opacity: 1
        });
      };

      const handleMouseLeave = () => {
        setTransform('perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)');
        setGlowPos(prev => ({ ...prev, opacity: 0 }));
      };

      const Illustration = DomainIllustrations[item.illustrationKey];

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          onClick={() => onSelect(item)}
          style={{ transform, transition: 'transform 0.18s ease-out' }}
          className="relative group rounded-2xl glass-panel glass-panel-hover p-6 cursor-pointer overflow-hidden flex flex-col justify-between"
        >
          {/* Mouse-tracking radial spotlight */}
          <div
            className="pointer-events-none absolute inset-0 transition-opacity duration-300"
            style={{
              opacity: glowPos.opacity,
              background: `radial-gradient(360px circle at ${glowPos.x}% ${glowPos.y}%, rgba(0, 240, 255, 0.14), transparent 70%)`
            }}
          />

          <div>
            <div className="flex items-center justify-between mb-4">
              <span className="text-xs font-mono uppercase tracking-wider px-2.5 py-1 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/25">
                {item.tag}
              </span>

    /* =========================================================
       7. LIVE QUANTUM & CIVILIZATION SIMULATOR (CANVAS + CONTROLS)
       ========================================================= */
    function FutureSimulatorSection() {
      const [autonomy, setAutonomy] = useState(72);
      const [robotics, setRobotics] = useState(65);
      const [cleanTech, setCleanTech] = useState(80);
      const canvasRef = useRef(null);

      // Calculated Civilization Metrics
      const metrics = useMemo(() => {
        const productivity = (1 + (autonomy * 0.045 + robotics * 0.055)).toFixed(1);
        const lifeExpectancy = Math.round(78 + (autonomy * 0.18 + cleanTech * 0.22));
        const workHours = Math.max(12, Math.round(40 - (robotics * 0.22 + autonomy * 0.08)));
        const spaceReadiness = Math.min(100, Math.round((autonomy + robotics + cleanTech) / 3));
        return { productivity, lifeExpectancy, workHours, spaceReadiness };
      }, [autonomy, robotics, cleanTech]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let phase = 0;

        const draw = () => {
          const w = (canvas.width = canvas.offsetWidth);
          const h = (canvas.height = canvas.offsetHeight);
          ctx.clearRect(0, 0, w, h);

          phase += 0.02 + autonomy * 0.0005;

          const waves = [
            { color: '#00f0ff', amp: (robotics / 100) * 48 + 12, freq: 0.012 + autonomy * 0.00015, offset: 0 },
            { color: '#a855f7', amp: (autonomy / 100) * 44 + 10, freq: 0.016 + robotics * 0.00012, offset: 1.8 },
            { color: '#10b981', amp: (cleanTech / 100) * 38 + 8, freq: 0.009 + cleanTech * 0.0001, offset: 3.4 },
          ];

          waves.forEach((wave) => {
            ctx.beginPath();
            for (let x = 0; x <= w; x += 3) {
              const y =
                h / 2 +
                Math.sin(x * wave.freq + phase + wave.offset) * wave.amp * Math.sin((x / w) * Math.PI);
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = wave.color;
            ctx.lineWidth = 2.4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = wave.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
          });

          animId = requestAnimationFrame(draw);
        };

        draw();
        return () => cancelAnimationFrame(animId);
      }, [autonomy, robotics, cleanTech]);

      const applyPreset = (a, r, c) => {
        setAutonomy(a);
        setRobotics(r);
        setCleanTech(c);
      };

      return (
        <section id="simulator" className="relative py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">

            <div className="text-center max-w-3xl mx-auto mb-14">

                <span>REAL-VAXT KVANT SİMULYATORU</span>
              </div>
              <h2 className="font-display text-3xl sm:text-5xl font-bold text-white mb-4">
                2050 Sivilizasiya <span className="text-gradient-cyber">Modelini Qurun</span>

              <p className="text-slate-400">

            </div>
          </RevealBlock>

          <RevealBlock delay={100}>
            <div className="rounded-3xl glass-panel p-6 sm:p-10 border border-cyan-500/25">
              {/* Scenario Presets */}
              <div className="flex flex-wrap items-center justify-between gap-4 pb-8 mb-8 border-b border-white/10">

                </span>

                  <button

                  </button>
                  <button

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
